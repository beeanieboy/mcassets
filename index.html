<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcassets</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#5a6896; --bg2:#1c2036; --card:#151827; --line:#2c3150; --purple:#8f7cf7; --text:#eef0ff; --dim:#9aa0c3; }
  * { box-sizing:border-box; margin:0; font-family:'Lexend',sans-serif; }
  body { min-height:100vh; display:grid; place-items:center; color:var(--text);
    background: radial-gradient(circle at 20% 0%, var(--bg1), var(--bg2) 70%); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.07;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg,#fff 1px, transparent 1px);
    background-size: 32px 32px; }
  .card { position:relative; width:min(380px, 90vw); padding:36px 30px; background:var(--card);
    border:2px solid var(--line); border-bottom:6px solid var(--purple); border-radius:6px;
    box-shadow: 0 20px 60px #0008; animation: pop .5s ease-out; }
  @keyframes pop { from { opacity:0; transform:translateY(20px) } }
  .brand { font-size:28px; font-weight:800; letter-spacing:-1px; margin-bottom:4px; }
  .brand span { color:var(--purple); }
  h2 { font-size:15px; font-weight:400; color:var(--dim); margin-bottom:26px; }
  label { display:block; font-size:12px; color:var(--dim); margin:0 0 6px; text-transform:uppercase; letter-spacing:1px; }
  input { width:100%; padding:13px 14px; margin-bottom:18px; background:#0e1020; color:var(--text);
    border:2px solid var(--line); border-radius:4px; font-size:15px; outline:none; transition:.2s; }
  input:focus { border-color:var(--purple); }
  .main { width:100%; padding:14px; border:none; border-radius:4px; background:var(--purple); color:#fff;
    font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 4px 0 #5b4bc4; transition:.1s; }
  .main:active { transform:translateY(4px); box-shadow:none; }
  .swap { margin-top:18px; text-align:center; font-size:14px; color:var(--dim); }
  .swap a, .later { color:var(--purple); cursor:pointer; text-decoration:none; }
  .later { display:block; margin-top:10px; text-align:center; font-size:13px; color:var(--dim); }
  .later:hover { color:var(--text); }
  #msg { min-height:20px; margin-top:14px; text-align:center; font-size:14px; }
  .tiny { position:fixed; bottom:12px; right:14px; font-size:11px; color:#ffffff40; }
</style>
</head>
<body>
  <div class="card">
    <img src="mcassets%20Logo.svg" alt="mcassets" style="height:36px; margin-bottom:8px">
    <h2 id="sub">welcome back</h2>

    <label>email</label>
    <input id="email" type="email" placeholder="you@email.com">
    <label>password</label>
    <input id="pass" type="password" placeholder="••••••••">

    <button class="main" id="mainBtn" onclick="go()">log in</button>
    <p id="msg"></p>

    <p class="swap"><span id="swapText">new here?</span> <a onclick="toggle()" id="swapLink">sign up</a></p>
    <a class="later" href="#">maybe later</a>
  </div>
  <p class="tiny">made by beeanieboy</p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient("https://purdrzpnwkxvrxghvfov.supabase.co", "sb_publishable_TSBSmRczOeTlN-upFBwFWg_QVFlKEZD")
const $ = id => document.getElementById(id)
const say = t => $("msg").textContent = t
let signingUp = false

function toggle() {
  signingUp = !signingUp
  $("mainBtn").textContent = signingUp ? "sign up" : "log in"
  $("sub").textContent = signingUp ? "make a free account" : "welcome back"
  $("swapText").textContent = signingUp ? "have an account?" : "new here?"
  $("swapLink").textContent = signingUp ? "log in" : "sign up"
  say("")
}

async function go() {
  const email = $("email").value, password = $("pass").value
  if (signingUp) {
    const { error } = await db.auth.signUp({ email, password })
    say(error ? error.message : "check your email to confirm!")
  } else {
    const { error } = await db.auth.signInWithPassword({ email, password })
    say(error ? error.message : "logged in!")
  }
}
</script>
</body>
</html>
