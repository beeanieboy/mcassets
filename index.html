<input id="email" placeholder="email">
<input id="pass" type="password" placeholder="password">
<button onclick="signUp()">sign up</button>
<button onclick="logIn()">log in</button>
<p id="msg"></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db = supabase.createClient("https://purdrzpnwkxvrxghvfov.supabase.co", "sb_publishable_TSBSmRczOeTlN-upFBwFWg_QVFlKEZD")
const val = id => document.getElementById(id).value
const say = t => document.getElementById("msg").textContent = t

async function signUp() {
  const { error } = await db.auth.signUp({ email: val("email"), password: val("pass") })
  say(error ? error.message : "check your email to confirm!")
}
async function logIn() {
  const { error } = await db.auth.signInWithPassword({ email: val("email"), password: val("pass") })
  say(error ? error.message : "logged in!")
}
</script>
